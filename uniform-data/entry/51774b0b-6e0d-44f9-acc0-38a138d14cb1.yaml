                children:
                  - mode: normal
                    text: >-
                      A breathable back panel helps manage heat on warm climbs,
                      while hydration compatibility keeps water within easy
                      reach so you can keep moving without breaking stride.
                      Trekking pole storage makes quick transitions simple when
                      the terrain changes, and the streamlined 28L design gives
                      you room for layers, trail food, and the essentials you
                      actually want to bring.
