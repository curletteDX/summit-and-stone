                    text: >-
                      The Alpine Trail Pack 28 is built for long miles, fast
                      climbs, and the kind of days when you forget to check the
                      clock because the trail keeps getting better. Lightweight
                      and comfortable from the first switchback to the last
                      descent, it carries close without feeling bulky and stays
                      easy on your shoulders when your route turns ambitious.
                    type: text
