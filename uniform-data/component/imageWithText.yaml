# yaml-language-server: $schema=https://uniform.app/schemas/json-schema/component-definition/v1.json
$schema: https://uniform.app/schemas/json-schema/component-definition/v1.json
id: imageWithText
name: Image With Text
icon: image-text
parameters:
  - id: heading
    name: Heading
    type: text
    typeConfig: null
    localizable: true
  - id: subheading
    name: Subheading
    type: text
    typeConfig: null
    localizable: true
  - id: content
    name: Content
    type: richText
    typeConfig:
      elements:
        builtIn:
          - h1
          - h2
          - h3
          - h4
          - h5
          - h6
          - unorderedList
          - orderedList
          - link
          - table
          - asset
          - variable
      required: false
      formatting:
        builtIn:
          - bold
          - italic
      elementsConfig:
        asset:
          allowedTypes:
            - image
    localizable: true
  - id: image
    name: Image
    type: asset
    typeConfig:
      allowedTypes:
        - image
    localizable: true
  - id: imagePosition
    name: Image Position
    type: select
    typeConfig:
      editor: select
      options:
        - text: Left
          value: left
        - text: Right
          value: right
useTeamPermissions: true
slots: []
titleParameter: heading
thumbnailParameter: image
canBeComposition: false
created: '2026-05-22T14:56:50.448014+00:00'
updated: '2026-05-22T15:22:52.109177+00:00'
