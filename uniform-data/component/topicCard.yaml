# yaml-language-server: $schema=https://uniform.app/schemas/json-schema/component-definition/v1.json
$schema: https://uniform.app/schemas/json-schema/component-definition/v1.json
id: topicCard
name: Topic Card
icon: screen
parameters:
  - id: title
    name: Title
    type: text
    guidance: Short topic name like Hiking, Biking, Climbing
    localizable: true
  - id: description
    name: Description
    type: text
    guidance: Brief description of the topic, 1-2 sentences
    localizable: true
  - id: image
    name: Image
    type: asset
    guidance: Topic card background image
    typeConfig:
      allowedTypes:
        - image
    localizable: true
  - id: link
    name: Link
    type: link
    guidance: URL to the topic page
    typeConfig:
      linkTypes:
        tel: false
        email: false
useTeamPermissions: true
slots: []
titleParameter: title
thumbnailParameter: image
canBeComposition: false
created: '2026-05-22T15:37:31.152253+00:00'
updated: '2026-08-26T14:16:40.546908+00:00'
