    geoKeyFacts:
      type: text
      locales:
        en-US: >-
          Summit & Stone focuses on hiking gear and outdoor advice.

          The page features gear for day hikes, weather changes, and long
          mountain miles.

          Featured gear includes a trail pack, shell jacket, and carbon trekking
          poles.

          The site also includes biking and climbing topics.

          Summit & Stone welcomes outdoor enthusiasts across experience levels
          and budgets.
    geoAiSummary:
      type: text
      locales:
        en-US: >-
          Summit & Stone is an outdoor destination for hikers and mountain
          adventurers looking for practical gear guidance and trail-ready
          products. The page highlights hiking essentials for day hikes,
          changing weather, and long mountain miles, alongside resources for
          biking and climbing. Its approach centers on choosing gear that suits
          a visitor’s trip, body, budget, and preferred outdoor activity rather
          than simply choosing the most expensive option. Summit & Stone
          presents trail-tested gear, straightforward advice about equipment
          tradeoffs, and an inclusive community for newcomers and experienced
          outdoor enthusiasts. Featured products include packs, shell jackets,
          and carbon trekking poles.
    ogDescription:
      type: text
      locales:
        en-US: >-
          Trail-tested hiking gear, practical outdoor advice, and a welcoming
          community for your next mountain adventure.
    aeoDirectAnswer:
      type: text
      locales:
        en-US: >-
          Summit & Stone offers trail-ready hiking gear, including packs, shell
          jackets, and trekking poles, plus practical advice for choosing
          equipment that fits your trip, body, budget, and outdoor goals. It
          also connects hikers with biking and climbing resources in a welcoming
          community for every experience level.
    aeoTargetQueries:
      type: text
      locales:
        en-US: |-
          What hiking gear do I need for a mountain hike?
          How do I choose a hiking pack?
          What is the best shell jacket for changing mountain weather?
          Where can I get honest outdoor gear advice?
          What gear is useful for long-distance hiking?
    geoPrimaryEntity:
