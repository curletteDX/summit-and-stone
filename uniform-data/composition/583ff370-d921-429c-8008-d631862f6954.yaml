        parameters:
          content:
            type: richText
            value:
              root:
                type: root
                format: ''
                indent: 0
                version: 1
                children:
                  - tag: h2
                    type: heading
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: Why Hiking Is Worth It
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          Hiking is one of the simplest ways to get outside,
                          clear your head, and reconnect with the world beyond
                          your screen. You do not need to summit a massive peak
                          or buy a garage full of gear to get started. A local
                          trail, a good pair of shoes, and a little curiosity
                          are enough.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          What makes hiking so rewarding? It slows you down in
                          the best way. You notice changing light through the
                          trees, the sound of water nearby, and the kind of
                          quiet that is hard to find in everyday life. It is
                          also a solid way to build strength and confidence,
                          whether you are heading out for a one-mile loop or
                          working up to bigger days on the trail. Your mountain,
                          your way.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                  - tag: h3
                    type: heading
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: Beginner Tips for a Better First Hike
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                  - tag: ul
                    type: list
                    start: 1
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - type: listitem
                        value: 1
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: Start small.
                            type: text
                            style: ''
                            detail: 0
                            format: 1
                            version: 1
                          - mode: normal
                            text: ' Choose a shorter trail with modest elevation so you can enjoy the experience without burning out.'
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 2
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: Check the basics.
                            type: text
                            style: ''
                            detail: 0
                            format: 1
                            version: 1
                          - mode: normal
                            text: ' Look up the weather, trail conditions, distance, and parking details before you leave.'
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 3
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: Bring water and snacks.
                            type: text
                            style: ''
                            detail: 0
                            format: 1
                            version: 1
                          - mode: normal
                            text: ' Even an easy hike feels better when you are hydrated and have something to refuel with.'
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 4
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: Wear what works.
                            type: text
                            style: ''
                            detail: 0
                            format: 1
                            version: 1
                          - mode: normal
                            text: ' Comfortable shoes with decent grip matter more than fancy gear.'
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 5
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: Take your time.
                            type: text
                            style: ''
                            detail: 0
                            format: 1
                            version: 1
                          - mode: normal
                            text: ' Hiking is not a race. Stop for views, catch your breath, and settle into your own pace.'
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 6
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: Leave no trace.
                            type: text
                            style: ''
                            detail: 0
                            format: 1
                            version: 1
                          - mode: normal
                            text: ' Pack out trash, stay on the trail, and help keep wild places worth visiting.'
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                    listType: bullet
                    direction: null
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          If you are new to hiking, local trails are the perfect
                          place to begin. They are easier to fit into a busy
                          schedule, easier to repeat, and a great way to learn
                          what kind of terrain and distance you enjoy most.
                          Every experienced hiker started somewhere, and often
                          it was closer to home than you would think.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          So pick a trail nearby and go see where it leads. You
                          do not need a huge plan. Just start walking. Trail
                          tested, peak approved.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                direction: null
          heading:
            type: text
            value: Hit the Trail with Confidence
