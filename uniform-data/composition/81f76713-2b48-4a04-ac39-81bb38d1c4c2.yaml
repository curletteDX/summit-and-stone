      - _id: 57834336-0db7-4f3a-a47f-dbf087c62393
        type: contentBlock
        parameters:
          content:
            type: richText
            value:
              root:
                type: root
                format: ''
                indent: 0
                version: 1
                children:
                  - tag: h2
                    type: heading
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: 'Biking: Simple, Fun, and Built for Adventure'
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          Biking is one of the easiest ways to get outside,
                          clear your head, and cover more ground than you can on
                          foot. It can be a quick spin around the neighborhood,
                          a dirt trail escape after work, or a full-day ride
                          with snacks in your pack and no rush to get home.
                          However you ride, biking gives you that sweet spot of
                          movement, freedom, and just enough wind in your face
                          to make an ordinary day feel better.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                  - tag: h3
                    type: heading
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: Why people love biking
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          People love biking because it meets you where you are.
                          You do not need to be a racer or a gear expert to
                          enjoy it. You can ride for fitness, for fun, for
                          commuting, or just for the excuse to take the long way
                          home.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                  - tag: ul
                    type: list
                    start: 1
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - type: listitem
                        value: 1
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              It feels good fast. Even a short ride can boost
                              your mood.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 2
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              It is accessible. You can start small and build
                              confidence as you go.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 3
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: It turns everyday routes into mini adventures.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 4
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              It works for different goals, from training rides
                              to family weekends.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 5
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              It helps you see more of your surroundings at a
                              human pace.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                    listType: bullet
                    direction: null
                  - tag: h3
                    type: heading
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: Beginner tips for getting started
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          If you are new to biking, keep it simple. You do not
                          need the perfect setup to begin. You just need a bike
                          that fits reasonably well, a helmet, and a route that
                          feels manageable.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                  - tag: ol
                    type: list
                    start: 1
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - type: listitem
                        value: 1
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              Start with short, easy rides. Pick a quiet
                              neighborhood street, bike path, or mellow trail
                              and focus on getting comfortable.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 2
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              Check the basics before you roll. Make sure your
                              tires have air, your brakes work, and your chain
                              is in decent shape.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 3
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              Wear what is comfortable. You do not need a full
                              kit for your first ride. Breathable clothes and
                              flat-out practical layers work just fine.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 4
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              Bring water and a small snack. Even a casual ride
                              feels better when you are not running on empty.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 5
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              Ride at your pace. Your mountain, your way also
                              applies to the bike path. There is no prize for
                              making your first ride harder than it needs to be.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                      - type: listitem
                        value: 6
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - mode: normal
                            text: >-
                              Learn one thing at a time. Practice shifting,
                              braking smoothly, and cornering before you worry
                              about speed or distance.
                            type: text
                            style: ''
                            detail: 0
                            format: 0
                            version: 1
                        direction: null
                    listType: number
                    direction: null
                  - tag: h3
                    type: heading
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: Get out and ride
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          The best way to get into biking is to stop waiting for
                          the perfect moment. Take the bike you have, choose a
                          route that sounds fun, and go see where it leads. Some
                          rides will be smooth. Some will include a wrong turn,
                          a squeaky brake, or a hill that feels a little rude.
                          That is part of it.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                  - type: paragraph
                    format: ''
                    indent: 0
                    version: 1
                    children:
                      - mode: normal
                        text: >-
                          Start small. Stay curious. Built for the long trail is
                          not just about gear. It is about showing up, ride
                          after ride, and finding your own rhythm outside. Get
                          out there and enjoy the spin.
                        type: text
                        style: ''
                        detail: 0
                        format: 0
                        version: 1
                    direction: null
                    textStyle: ''
                    textFormat: 0
                direction: null
          heading:
            type: text
            value: Ride Far. Ride Ready.
  _locales:
    - en-US
